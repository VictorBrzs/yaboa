
  <!DOCTYPE html>
  <html lang="en">
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <title>Yaboa</title>
      <style>
        html,
        body {
          height: 100%;
          margin: 0;
          background: #ffffff;
        }

        #root {
          height: 100%;
        }

        .boot-screen {
          min-height: 100%;
          display: grid;
          place-items: center;
          background: #ffffff;
          font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .boot-card {
          width: min(260px, 74vw);
          display: grid;
          justify-items: center;
          gap: 22px;
        }

        .boot-card img {
          width: min(220px, 100%);
          height: auto;
        }

        .boot-bar {
          width: 100%;
          height: 7px;
          overflow: hidden;
          border-radius: 999px;
          background: #ffedd5;
        }

        .boot-bar span {
          display: block;
          width: 42%;
          height: 100%;
          border-radius: inherit;
          background: #f97316;
          animation: boot-progress 1.05s ease-in-out infinite;
        }

        @keyframes boot-progress {
          0% {
            transform: translateX(-120%);
          }
          100% {
            transform: translateX(260%);
          }
        }
      </style>
    </head>

    <body>
      <div id="root">
        <div class="boot-screen">
          <div class="boot-card">
            <img src="/src/assets/brand/yaboa-cropped.png" alt="Yaboa" />
            <div class="boot-bar"><span></span></div>
          </div>
        </div>
      </div>
      <script type="module" src="/src/main.tsx"></script>
    </body>
  </html>
